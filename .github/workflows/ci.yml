name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

defaults:
  run:
    shell: bash

jobs:
  server-unit:
    name: Server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Compile Server sources
        run: python -m compileall -q server
      - name: Run all Server tests
        working-directory: server
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  engine-integration:
    name: Full engine contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install the supported engine combination
        run: >-
          uv pip install --system -r server/requirements-dev.txt
          pdf2zh-next==2.9.0 BabelDOC==0.6.2 PyMuPDF==1.25.2
          bitstring==4.3.1 openai==2.3.0
      - name: Check dependency compatibility
        run: uv pip check --system
      - name: Verify actual imports and managed runtime capabilities
        working-directory: server
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from bitstring import BitStream
          from babeldoc.format.pdf.document_il.backend.pdf_creater import PDFCreater
          from pdf2zh_next.translator.translator_impl.openai import OpenAITranslator
          from utils.environment_lifecycle import validate_environment

          requirements = [
              'pdf2zh-next==2.9.0', 'BabelDOC==0.6.2', 'PyMuPDF==1.25.2',
              'bitstring==4.3.1', 'openai==2.3.0',
          ]
          assert BitStream('0b101').read('uint:3') == 5
          assert callable(PDFCreater) and callable(OpenAITranslator)
          assert validate_environment(
              'pdf2zh_next', Path(sys.executable), requirements,
              require_deepseek_thinking=True,
          )
          PY
      - name: Run real SDK, translator, spawn, and configuration contracts
        working-directory: server
        run: |
          python - <<'PY'
          import unittest

          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.discover('tests', pattern=name) for name in (
              'test_engine_compat.py',
              'test_deepseek_runner.py',
              'test_openai_config_compat.py',
              'test_managed_environment_isolation.py',
              'test_asset_downloads.py',
              'test_engine_logging.py',
              'test_rich_text_compat.py',
              'test_progress_output.py',
              'test_progress_output_integration.py',
              'test_partial_translation_failure.py',
          ))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit('Full engine contracts must pass without skipped tests')
          PY

  package:
    name: Plugin and release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci
      - name: Lint plugin
        working-directory: plugin
        run: npm run lint:check
      - name: Test plugin
        working-directory: plugin
        run: npm test
      - name: Build plugin
        working-directory: plugin
        run: npm run build
      - name: Build and verify all release artifacts
        run: python tools/build_release.py --output dist
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
